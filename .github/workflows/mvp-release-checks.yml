name: MVP release checks

# First committed in PR 8 (never run on GitHub before this PR): the checks that guard the controlled-pilot deployment path. NOTHING here deploys.
#  - migration-runner: the approved-migration manifest matches git HEAD; the runner image builds from the FROZEN lockfile and passes its
#    disposable-database verification (refuses unapproved / tampered / drifted migrations, one runner at a time, backup-independent checks).
#  - staging-config: the staging Compose file and both Caddyfiles are syntactically valid, and the env preflight refuses unsafe files.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Approved-migration manifest matches the migrations committed at HEAD
        run: node infra/migrate/generate-approved-manifest.mjs --check
      - name: Build the migration runner image (frozen lockfile)
        run: docker build -f infra/migrate/Dockerfile -t flower/migrate:ci .
      - name: Verify the runner against a disposable PostgreSQL
        run: node infra/migrate/verify.mjs flower/migrate:ci

  staging-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Preflight refuses the placeholder example
        run: |
          if node infra/staging/preflight.mjs infra/staging/.env.example; then echo "preflight accepted the placeholder file"; exit 1; fi
      - name: Compose file is valid with a generated (random) environment
        run: |
          node -e "
          const r=()=>require('crypto').randomBytes(18).toString('hex');
          const d=(c)=>c.repeat(64); // well-formed but fake digests: the preflight now requires immutable application images, and this step only validates configuration
          const e=['POS_HOST=pos.ci.flower-saas.dev','OWNER_HOST=owner.ci.flower-saas.dev','OPS_HOST=ops.ci.flower-saas.dev','ADMIN_CIDR=203.0.113.0/24','API_IMAGE=flower/api@sha256:'+d('1'),'POS_IMAGE=flower/pos-pwa@sha256:'+d('2'),'OWNER_IMAGE=flower/owner-web@sha256:'+d('3'),'MIGRATE_IMAGE=flower/migrate@sha256:'+d('4'),'POSTGRES_IMAGE='+require('fs').readFileSync('infra/staging/postgres-image.pin','utf8').split('\n').find(l=>l.trim()&&!l.startsWith('#')).trim(),'MIGRATION_MODE=check','POSTGRES_SUPERUSER_PASSWORD='+r(),'POSTGRES_DB=flower','APP_DB_PASSWORD='+r(),'PLATFORM_DB_PASSWORD='+r(),'REDIS_PASSWORD='+r(),'MINIO_ROOT_USER=flower_minio','MINIO_ROOT_PASSWORD='+r(),'AUTH_JWT_SECRET='+r(),'SECRETS_PROVIDER=disabled'];
          require('fs').writeFileSync('infra/staging/.env.ci',e.join('\n')+'\n')"
          chmod 600 infra/staging/.env.ci # the preflight (correctly) refuses an env file readable by group/others
          node infra/staging/preflight.mjs infra/staging/.env.ci
          docker compose -f infra/staging/docker-compose.staging.yml --env-file infra/staging/.env.ci config -q
      - name: Preflight refuses tag-only application images and out-of-range backup settings (for the right reason)
        run: |
          refused() { # <sed expression> <expected reason fragment>
            sed "$1" infra/staging/.env.ci > infra/staging/.env.ci.bad
            chmod 600 infra/staging/.env.ci.bad
            if out=$(node infra/staging/preflight.mjs infra/staging/.env.ci.bad 2>&1); then echo "preflight accepted: $1"; exit 1; fi
            echo "$out" | grep -q "$2" || { echo "refused for the wrong reason (wanted '$2'): $out"; exit 1; }
          }
          refused 's|^API_IMAGE=.*|API_IMAGE=flower/api:ci|' 'API_IMAGE must be an immutable reference'
          refused 's|^API_IMAGE=.*|API_IMAGE=flower/api:latest|' 'API_IMAGE must be an immutable reference'
          refused 's|^API_IMAGE=.*|API_IMAGE=flower/api@sha256:abc|' 'API_IMAGE must be an immutable reference'
          refused 's|^POS_IMAGE=.*|POS_IMAGE=flower/pos-pwa:ci|' 'POS_IMAGE must be an immutable reference'
          refused 's|^OWNER_IMAGE=.*|OWNER_IMAGE=flower/owner-web:ci|' 'OWNER_IMAGE must be an immutable reference'
          refused 's|^MIGRATE_IMAGE=.*|MIGRATE_IMAGE=flower/migrate:ci|' 'MIGRATE_IMAGE must be an immutable reference'
          refused '$a BACKUP_KEEP=2' 'BACKUP_KEEP must be a whole number from 3 to 365'
          refused '$a BACKUP_KEEP=abc' 'BACKUP_KEEP must be a whole number from 3 to 365'
          refused '$a BACKUP_INTERVAL_HOURS=25' 'BACKUP_INTERVAL_HOURS must be a whole number from 1 to 24'
          # in-range settings are accepted, and a tag is a --local rehearsal convenience only
          sed '$a BACKUP_KEEP=14' infra/staging/.env.ci | sed '$a BACKUP_INTERVAL_HOURS=24' > infra/staging/.env.ci.ok
          chmod 600 infra/staging/.env.ci.ok
          node infra/staging/preflight.mjs infra/staging/.env.ci.ok
          sed 's|^API_IMAGE=.*|API_IMAGE=flower/api:ci|' infra/staging/.env.ci > infra/staging/.env.ci.bad
          chmod 600 infra/staging/.env.ci.bad
          node infra/staging/preflight.mjs infra/staging/.env.ci.bad --local
          rm -f infra/staging/.env.ci.bad infra/staging/.env.ci.ok
      - name: Preflight refuses a floating, tag-only, wrong-major or unreviewed PostgreSQL image (for the right reason)
        run: |
          Z=$(printf '0%.0s' {1..64})
          # the 17.12 index digest: well-formed, but NOT the reviewed pin
          OTHER=postgres:17.12@sha256:97fb53376be3e4fb1a8a61421daa69dcc3bf2fa39bda3259f5245f9a455af1a9
          refused() { # <value> <expected reason fragment>
            sed "s|^POSTGRES_IMAGE=.*|POSTGRES_IMAGE=$1|" infra/staging/.env.ci > infra/staging/.env.ci.bad
            chmod 600 infra/staging/.env.ci.bad
            if out=$(node infra/staging/preflight.mjs infra/staging/.env.ci.bad 2>&1); then echo "preflight accepted POSTGRES_IMAGE=$1"; exit 1; fi
            echo "$out" | grep -q "$2" || { echo "refused POSTGRES_IMAGE=$1 for the wrong reason (wanted '$2'): $out"; exit 1; }
          }
          for bad in postgres:17 postgres:latest postgres postgres:17-alpine postgres:18.1 postgres:17.11 postgres:17.11@sha256:abc "postgres:18.1@sha256:$Z" "postgres:17@sha256:$Z"; do
            refused "$bad" "POSTGRES_IMAGE must be postgres:17"
          done
          refused "$OTHER" "reviewed pin"
          # a plain 17.<minor> tag is a --local rehearsal convenience only
          sed "s|^POSTGRES_IMAGE=.*|POSTGRES_IMAGE=postgres:17.11|" infra/staging/.env.ci > infra/staging/.env.ci.bad
          chmod 600 infra/staging/.env.ci.bad
          node infra/staging/preflight.mjs infra/staging/.env.ci.bad --local
          rm -f infra/staging/.env.ci.bad
      - name: Preflight refuses a weak or missing pin file (tag-only, wrong major, floating major, absent)
        run: |
          Z=$(printf '0%.0s' {1..64})
          cp infra/staging/postgres-image.pin "$RUNNER_TEMP/postgres-image.pin.orig"
          trap 'cp "$RUNNER_TEMP/postgres-image.pin.orig" infra/staging/postgres-image.pin; rm -f infra/staging/.env.ci.bad' EXIT
          for pin in postgres:17.11 "postgres:18.1@sha256:$Z" "postgres:17@sha256:$Z" postgres:latest; do
            printf '%s\n' "$pin" > infra/staging/postgres-image.pin
            sed "s|^POSTGRES_IMAGE=.*|POSTGRES_IMAGE=$pin|" infra/staging/.env.ci > infra/staging/.env.ci.bad
            chmod 600 infra/staging/.env.ci.bad
            if out=$(node infra/staging/preflight.mjs infra/staging/.env.ci.bad 2>&1); then echo "preflight accepted the weak pin $pin"; exit 1; fi
            echo "$out" | grep -q "postgres-image.pin must hold" || { echo "weak pin $pin refused for the wrong reason: $out"; exit 1; }
          done
          rm -f infra/staging/postgres-image.pin
          if out=$(node infra/staging/preflight.mjs infra/staging/.env.ci 2>&1); then echo "preflight accepted a missing pin file"; exit 1; fi
          echo "$out" | grep -q "postgres-image.pin must hold" || { echo "missing pin refused for the wrong reason: $out"; exit 1; }
      - name: check-release refuses a compose file that bypasses the reviewed pin (floating, unreviewed digest, split images)
        run: |
          F=infra/staging/docker-compose.staging.yml
          cp "$F" "$RUNNER_TEMP/compose.orig"
          trap 'cp "$RUNNER_TEMP/compose.orig" "$F"' EXIT
          OTHER=postgres:17.12@sha256:97fb53376be3e4fb1a8a61421daa69dcc3bf2fa39bda3259f5245f9a455af1a9
          PIN=$(grep -vE '^[[:space:]]*(#|$)' infra/staging/postgres-image.pin | head -1)
          PH='${POSTGRES_IMAGE:?[^}]*}' # the placeholder in both the postgres and the backup service
          expect_refused() { # <reason fragment> <sed expression>...
            reason=$1; shift
            cp "$RUNNER_TEMP/compose.orig" "$F"
            for expr in "$@"; do sed -i "$expr" "$F"; done
            if out=$(node infra/staging/check-release.mjs infra/staging/.env.ci 2>&1); then echo "check-release accepted: $reason"; exit 1; fi
            echo "$out" | grep -q "$reason" || { echo "refused for the wrong reason (wanted '$reason'): $out"; exit 1; }
          }
          # both services float on a literal tag
          expect_refused "must be postgres:17" "s|$PH|postgres:17|"
          # both services on the same, well-formed, unreviewed digest
          expect_refused "reviewed pin" "s|$PH|$OTHER|"
          # postgres on the reviewed pin, backup on something else (the first placeholder is the postgres service, the second the backup job)
          expect_refused "same image" "0,/$PH/s|$PH|$PIN|" "s|$PH|$OTHER|"
      - name: Start order, published ports, healthchecks and workflow references
        run: node infra/staging/check-release.mjs infra/staging/.env.ci
      - name: Caddyfiles are valid
        run: |
          for f in Caddyfile Caddyfile.local; do
            docker run --rm -i -e POS_HOST=a.example.test -e OWNER_HOST=b.example.test -e OPS_HOST=c.example.test -e ADMIN_CIDR=203.0.113.0/24 caddy:2 \
              sh -c 'cat > /tmp/Caddyfile && caddy validate --config /tmp/Caddyfile' < infra/staging/$f
          done

  # The staging recovery scripts (backup, retention, scheduler, role bootstrap and off-host restore, Redis flush, host readiness) against DISPOSABLE
  # containers named flower-offhost-probe-* or against command shims. Nothing here touches a real database, host or secret, and nothing deploys.
  # Each script runs even if an earlier one failed, so one run reports all three results.
  staging-ops-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Host readiness checks (command shims, no Docker needed)
        run: bash infra/staging/ops/host-readiness.test.sh
      - name: Backup, retention, role bootstrap, off-host restore and Redis flush (disposable PostgreSQL and Redis)
        if: always()
        run: bash infra/staging/ops/ops.test.sh
      - name: The backup-scheduler Compose service, its healthcheck and its retention
        if: always()
        run: bash infra/staging/ops/scheduler-service.test.sh
