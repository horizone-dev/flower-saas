name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  # ── Gate 1: correctness (typecheck · lint · unit + integration · build) ──────
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pins pnpm from package.json)
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Lint (boundaries + no-raw-prisma + route-permission + no-scope-from-request)
        run: pnpm -w lint

      - name: Security-invariant tests (fast pre-flight — fail before the heavy suite)
        # PHASE-1-PLAN §1.15. The pure invariants: the policy truth-table, the
        # auditable-action registry ↔ security_event sync, the probe harness,
        # and realm disjointness / secret-custody in @flower/permissions.
        # The request-context + scoped/platform-repository primitives moved to
        # @flower/backend in Phase 2-core task 2.3 (FC-3); their unit tests moved
        # with them.
        run: |
          pnpm --filter @flower/api exec vitest run \
            src/modules/access/policy-engine.test.ts \
            src/modules/access/policy.service.test.ts \
            src/common/audit/actions.test.ts
          pnpm --filter @flower/backend exec vitest run \
            src/context/request-context.test.ts \
            src/data/scoped-repository.test.ts
          pnpm --filter @flower/permissions exec vitest run
          pnpm --filter @flower/testing exec vitest run src/probes.test.ts

      - name: Unit + integration tests
        # Build-blocking Phase 1 security gates (PHASE-1-PLAN §1.15):
        #   - cross-tenant probe suite   apps/api/src/probes/cross-tenant.probe.test.ts
        #   - guard-pipeline auth e2e     apps/api/src/common/auth/pipeline.e2e.test.ts
        #   - auth / session integration  apps/api/src/modules/identity/auth.integration.test.ts
        #   - limit enforcement           apps/api/src/modules/{platform,org}/*.integration.test.ts
        #   - secret redaction            apps/api/src/modules/secrets/secrets.integration.test.ts
        #   - audit compliance            apps/api/src/modules/platform/audit-foundation.integration.test.ts
        # plus @flower/db (Testcontainers Postgres) and spike-rls (PgBouncer).
        run: pnpm turbo run test --concurrency=2

      - name: Build (every app + package)
        run: pnpm -w build

      - name: Negative-test — boundary + scope violation must fail lint
        run: pnpm --filter @flower/config test:negative

  # ── Gate 1b: Super Admin Web end-to-end smoke ──────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pins pnpm from package.json)
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (api dist + web .next + workspace deps)
        run: pnpm -w build

      - name: Install Playwright Chromium
        run: pnpm --filter @flower/super-admin-web exec playwright install --with-deps chromium

      - name: Smoke (Testcontainers Postgres + Redis, api + web processes)
        run: pnpm --filter @flower/super-admin-web test:e2e

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: apps/super-admin-web/test-results/
          if-no-files-found: ignore

  # ── Gate 2: supply-chain & secret scanning ─────────────────────────────────
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pins pnpm from package.json)
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Secret custody — no tenant-realm permission key matches /secret/i
        run: |
          pnpm --filter @flower/permissions build
          pnpm --filter @flower/tooling-scripts check:no-tenant-secret-key

      - name: SBOM (CycloneDX, via Syft — understands pnpm-lock.yaml)
        uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

      - name: Dependency vulnerability scan (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --recursive

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required by gitleaks-action >=2.3.3 to scan pull_request events
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      - name: Trivy — Dockerfile misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/docker
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Trivy — filesystem vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0' # report-only for now; tighten during hardening (Phase 10)
