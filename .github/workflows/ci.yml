name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  # ── Gate 1: correctness (typecheck · lint · unit + integration · build) ──────
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pins pnpm from package.json)
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -w typecheck

      - name: Lint (boundaries + no-raw-prisma + route-permission + no-scope-from-request)
        run: pnpm -w lint

      - name: Security-invariant tests (fast pre-flight — fail before the heavy suite)
        # PHASE-1-PLAN §1.15. The pure invariants: the policy truth-table, the
        # auditable-action registry ↔ security_event sync, the probe harness,
        # and realm disjointness / secret-custody in @flower/permissions.
        # The request-context + scoped/platform-repository primitives moved to
        # @flower/backend in Phase 2-core task 2.3 (FC-3); their unit tests moved
        # with them.
        run: |
          pnpm --filter @flower/api exec vitest run \
            src/modules/access/policy-engine.test.ts \
            src/modules/access/policy.service.test.ts \
            src/common/audit/actions.test.ts
          pnpm --filter @flower/backend exec vitest run \
            src/context/request-context.test.ts \
            src/data/scoped-repository.test.ts
          pnpm --filter @flower/permissions exec vitest run
          pnpm --filter @flower/testing exec vitest run src/probes.test.ts

      - name: Unit + integration tests
        # Build-blocking Phase 1 security gates (PHASE-1-PLAN §1.15):
        #   - cross-tenant probe suite   apps/api/src/probes/cross-tenant.probe.test.ts
        #   - guard-pipeline auth e2e     apps/api/src/common/auth/pipeline.e2e.test.ts
        #   - auth / session integration  apps/api/src/modules/identity/auth.integration.test.ts
        #   - limit enforcement           apps/api/src/modules/{platform,org}/*.integration.test.ts
        #   - secret redaction            apps/api/src/modules/secrets/secrets.integration.test.ts
        #   - audit compliance            apps/api/src/modules/platform/audit-foundation.integration.test.ts
        # plus @flower/db (Testcontainers Postgres) and spike-rls (PgBouncer).
        run: pnpm turbo run test --concurrency=2

      - name: Build (every app + package)
        run: pnpm -w build

      - name: Negative-test — boundary + scope violation must fail lint
        run: pnpm --filter @flower/config test:negative

  # ── Gate 1b: Super Admin Web end-to-end smoke ──────────────────────────────
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pins pnpm from package.json)
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (api dist + web .next + workspace deps)
        run: pnpm -w build

      - name: Install Playwright Chromium
        run: pnpm --filter @flower/super-admin-web exec playwright install --with-deps chromium

      - name: Smoke (Testcontainers Postgres + Redis, api + web processes)
        run: pnpm --filter @flower/super-admin-web test:e2e

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: apps/super-admin-web/test-results/
          if-no-files-found: ignore

  # ── Gate 1c: realtime acceptance suite (ADR-0017, build-blocking) ──────────
  # The frozen realtime acceptance surface (HG-RT-AUTHZ / HG-RT-FANOUT /
  # HG-RT-REVOKE / HG-RT-RESUME, ADR-0017 "Acceptance tests"). These also run
  # inside `verify` via `turbo run test`; this job exists so the realtime gate
  # is an independently visible, independently green required check — and so a
  # realtime regression is not buried in the middle of the full matrix.
  #
  # Coverage (apps/realtime full suite + apps/worker realtime-relay + retention):
  #   - server-derived subscription authz, tenant + branch isolation
  #   - two-gateway fanout, duplicate event_id suppression
  #   - multi-gateway session revocation, token-refresh scope narrowing
  #   - relay restart / XAUTOCLAIM reclaim (worker realtime-relay)
  #   - resume / replay, race-free replay→live handoff
  #   - F8 + F9 resolution (reducer has no seq-gap arithmetic)
  #   - retention-gap → resync-required, within-retention replay
  #   - heartbeat / filtered-event leakage protection
  #   - fault injection (mid-replay Redis loss) + recovery
  #   - Stream retention: XTRIM MINID floor, tenant isolation, idempotency (2.8)
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pins pnpm from package.json)
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (realtime + worker + their workspace deps)
        run: pnpm turbo run build --filter=@flower/realtime --filter=@flower/worker

      - name: Realtime gateway acceptance suite (apps/realtime)
        run: pnpm --filter @flower/realtime exec vitest run

      - name: Worker realtime-relay + Stream-retention suites (apps/worker)
        run: pnpm --filter @flower/worker exec vitest run src/realtime-relay src/stream-retention

  # ── Gate 1d: tenant / branch isolation on PostgreSQL 17.12 (build-blocking) ─
  # The startTestStack() suites (incl. the probes in `verify`) run on the
  # TEMPORARY digest-pinned PostgreSQL 17.11 CI test image (ADR-0013 amendment
  # of 2026-11-28, review by 2026-12-15). 17.11 lacks CVE fixes shipped in
  # 17.12, four of them about RLS / row visibility, and 17.11 is NOT authorised
  # for staging or production. This job re-runs ONLY the isolation probe suites
  # (cross-tenant + branch, incl. their RLS-level FORCE / no-GUC / NOBYPASSRLS
  # assertions) on digest-pinned 17.12. It deliberately excludes the frozen
  # report performance / query-plan tests (Finding A/B) — they stay in `verify`
  # on 17.11, with no threshold or SQL change. @flower/db RLS schema tests and
  # tooling/spikes/rls already start `postgres:17` (17.12 today) in `verify`
  # and are not repeated here. No continue-on-error: any leak fails the build.
  isolation-pg17-12:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Docker Hub multi-arch index digest of postgres:17.12, verified 2026-11-28.
      FLOWER_TEST_POSTGRES_IMAGE: postgres:17.12@sha256:97fb53376be3e4fb1a8a61421daa69dcc3bf2fa39bda3259f5245f9a455af1a9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pins pnpm from package.json)
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (api workspace deps)
        run: pnpm turbo run build --filter=@flower/api^...

      - name: Guard — PostgreSQL 17.12 by server version and image digest, with negative controls
        env:
          NEGATIVE_CONTROL_IMAGE: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        run: |
          GUARD=$(cat <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { startTestStack, resolvePostgresImage } from '@flower/testing';
          const image = resolvePostgresImage();
          const wantDigest = image.slice(image.indexOf('@') + 1);
          const stack = await startTestStack({ services: ['postgres'] });
          try {
            const r = await stack.postgres.container.exec(['psql', '-U', 'flower', '-d', 'flower_test', '-tAc', 'SHOW server_version_num']);
            const num = r.stdout.trim();
            const imageId = execFileSync('docker', ['inspect', '-f', '{{.Image}}', stack.postgres.container.getId()], { encoding: 'utf8' }).trim();
            const digests = execFileSync('docker', ['image', 'inspect', '-f', '{{join .RepoDigests ","}}', imageId], { encoding: 'utf8' }).trim();
            const digestOk = digests.split(',').some((d) => d.endsWith('@' + wantDigest));
            console.log(`::notice title=${process.env.GUARD_LABEL}::requested=${image} server_version_num=${num} repo_digests=${digests} digest_match=${digestOk}`);
            if (r.exitCode !== 0 || num !== '170012' || !digestOk) { console.log('guard: expected PostgreSQL 17.12 (170012) from ' + wantDigest); process.exitCode = 1; }
          } finally { await stack.stop(); }
          EOF
          )
          guard() { pnpm --filter @flower/api exec node --input-type=module -e "$GUARD"; }
          # 1. the job's image must be PostgreSQL 17.12 with the pinned digest
          GUARD_LABEL='PostgreSQL test image' guard
          # 2. negative control: the same guard must REJECT the 17.11 default image
          if FLOWER_TEST_POSTGRES_IMAGE="$NEGATIVE_CONTROL_IMAGE" GUARD_LABEL='Negative control 17.11 (must be rejected)' guard; then
            echo '::error::negative control failed: the guard accepted PostgreSQL 17.11'; exit 1
          fi
          # 3. negative control: a floating tag must be refused before any container starts
          if FLOWER_TEST_POSTGRES_IMAGE=postgres:17 GUARD_LABEL='Negative control floating tag' guard; then
            echo '::error::negative control failed: a floating postgres:17 override was accepted'; exit 1
          fi
          echo '::notice title=Negative controls::17.11 digest rejected; floating postgres:17 override refused'

      - name: Cross-tenant + branch isolation probes (PostgreSQL 17.12)
        run: pnpm --filter @flower/api exec vitest run src/probes/cross-tenant.probe.test.ts src/probes/branch-isolation.probe.test.ts

  # ── Gate 2: supply-chain & secret scanning ─────────────────────────────────
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pins pnpm from package.json)
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Secret custody — no tenant-realm permission key matches /secret/i
        run: |
          pnpm --filter @flower/permissions build
          pnpm --filter @flower/tooling-scripts check:no-tenant-secret-key

      - name: SBOM (CycloneDX, via Syft — understands pnpm-lock.yaml)
        uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

      - name: Dependency vulnerability scan (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --recursive

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required by gitleaks-action >=2.3.3 to scan pull_request events
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      - name: Trivy — Dockerfile misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/docker
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Trivy — filesystem vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0' # report-only for now; tighten during hardening (Phase 10)
