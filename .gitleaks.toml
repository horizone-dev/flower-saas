# Flower SaaS — gitleaks config. Extends the default ruleset; adds an allowlist
# for deliberately-fake values in tests, fixtures and ADR examples. Real secrets
# never live in the repo (CLAUDE.md rule 38 / SECURITY.md — all external
# credentials are Platform-Super-Admin-only, KMS-encrypted).

title = "Flower SaaS"

[extend]
useDefault = true

# Two narrow, content-constrained exceptions for VERIFIED false positives (owner decision 2026-11-18; security-reviewer approval required before merge).
# Both are allowlists attached to the single default rule `generic-api-key` (every other rule still scans the same files) and each applies only when
# ALL of its conditions hold (condition = AND). Nothing is disabled for any file.
[[rules]]
id = "generic-api-key"

# (1) `infra/migrate/approved-migrations.json` is GENERATED by `infra/migrate/generate-approved-manifest.mjs` (migration folder name -> SHA-256 of its
# migration.sql). The rule fires on the word "token" in the migration name `..._idempotency_claim_token`; the value is a hash, not a credential (it
# equals sha256 of the committed migration.sql). Applies only to that exact file AND only when the matched text is exactly
# `<14-digit timestamp>_<snake_case name>": "<64 lowercase hex>"`. CI's `generate-approved-manifest.mjs --check` also fails if the file differs from the
# hashes of the migrations committed at HEAD.
[[rules.allowlists]]
description = "generated approved-migration manifest: '<timestamp>_<name>': '<sha256 hex>' entries only"
condition = "AND"
paths = ['''^infra/migrate/approved-migrations\.json$''']
regexTarget = "match"
regexes = ['''^\d{14}_[a-z0-9_]+"\s*:\s*"[0-9a-f]{64}"$''']

# (2) The approval `.patch` artefacts under docs/decisions carry test code that uses the PUBLIC fake fixture password every *.integration.test.ts
# already uses (path-allowlisted above). The patches are hash-pinned (security-review-share/SHARE-MANIFEST.json) and cannot be edited. Applies only to
# `docs/decisions/**/*.patch` AND only when the secret is exactly that fixture value (this REPLACES the broader value-only entry first proposed).
[[rules.allowlists]]
description = "public fake test password inside the hash-pinned approval patches"
condition = "AND"
paths = ['''^docs/decisions/.*\.patch$''']
regexes = ['''^CorrectHorseBatteryStaple9$''']

[allowlist]
description = "test fixtures, dev placeholders and doc examples — not real credentials"

paths = [
  '''.*\.test\.ts$''',
  '''.*\.spec\.ts$''',
  '''.*/fixtures/.*''',
  '''packages/config/fixtures/.*''',
  '''docs/decisions/ADR-.*\.md$''',
  '''\.env\.example$''',
]

regexes = [
  # the dev-only JWT secret default (env.ts) + its integration-test sibling
  '''dev-only-insecure-jwt-secret-change-me-\d+''',
  '''integration-test-jwt-secret-\d+''',
  # the dev-only secrets-vault master key default (env.ts) — refused in production (G16)
  '''dev-only-insecure-secrets-master-key-change-me-\d+''',
  # the fixed argon2id "dummy" digest used for constant-time login (auth.service.ts)
  '''\$argon2id\$v=19\$m=19456,t=2,p=1\$[A-Za-z0-9+/=]+\$[A-Za-z0-9+/=]+''',
]
